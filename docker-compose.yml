services:
  # ── App database ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-domainapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-domainapp}
      POSTGRES_DB: ${POSTGRES_DB:-domain_knowledge}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-domainapp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Keycloak database ─────────────────────────────────────────────────────────
  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KC_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      POSTGRES_DB: ${KC_DB_DATABASE:-keycloak}
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USERNAME:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Keycloak ──────────────────────────────────────────────────────────────────
  # Runs in production mode (start) with HTTP enabled so it works without TLS
  # both locally and on EC2. Realm is imported from KC_REALM_FILE on first start.
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    restart: unless-stopped
    command: start --import-realm --http-enabled=true --hostname-strict=false
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KC_DB_DATABASE:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      # Used for redirect URI / client secret substitution inside realm JSON (Keycloak 22+)
      KC_APP_URL: ${APP_URL:-http://localhost:3000}
      KC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-dev-client-secret}
      # Production: set to the external URL of the Keycloak instance
      KC_HOSTNAME_URL: ${KC_HOSTNAME_URL:-}
    ports:
      - "8080:8080"
    volumes:
      # Mount only the selected realm file. Override KC_REALM_FILE in .env.prod
      # to use the production realm (keycloak/realm.prod.json).
      - ${KC_REALM_FILE:-./keycloak/realm.json}:/opt/keycloak/data/import/realm.json

  # ── Nuxt application ──────────────────────────────────────────────────────────
  # Built from the Dockerfile in the project root. For local development, run
  # "npm run dev" instead and start only: docker compose up db keycloak-db keycloak
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-domainapp}:${POSTGRES_PASSWORD:-domainapp}@db:5432/${POSTGRES_DB:-domain_knowledge}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-me-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://keycloak:8080/realms/domain-app}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-domain-knowledge-app}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-dev-client-secret}
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  keycloak_data:
