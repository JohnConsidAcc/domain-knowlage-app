services:
  # ── App database ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-domainapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-domainapp}
      POSTGRES_DB: ${POSTGRES_DB:-domain_knowledge}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-domainapp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Keycloak database ─────────────────────────────────────────────────────────
  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KC_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      POSTGRES_DB: ${KC_DB_DATABASE:-keycloak}
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USERNAME:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Keycloak ──────────────────────────────────────────────────────────────────
  # Runs in production mode (start) with HTTP enabled so it works without TLS
  # both locally and on EC2. Realm is imported from KC_REALM_FILE on first start.
  # The health check uses bash /dev/tcp (no curl/wget needed in the UBI9-minimal
  # image) to wait until port 8080 is accepting connections before the app starts.
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    restart: unless-stopped
    command: start --import-realm --http-enabled=true --hostname-strict=false --http-relative-path=/auth
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KC_DB_DATABASE:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      KC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-dev-client-secret}
      # External URL Keycloak uses to build HTTPS links in tokens and discovery.
      KC_HOSTNAME_URL: ${KC_HOSTNAME_URL:-}
      # Trust X-Forwarded-Proto / X-Forwarded-Host from the Nginx proxy so
      # Keycloak builds HTTPS URLs with the correct port (8443) in responses.
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "8080:8080"
    volumes:
      # Mount only the selected realm file. Override KC_REALM_FILE in .env.prod
      # to use the production realm (keycloak/realm.prod.json).
      - ${KC_REALM_FILE:-./keycloak/realm.json}:/opt/keycloak/data/import/realm.json

  # ── Nuxt application ──────────────────────────────────────────────────────────
  # Built from the Dockerfile in the project root. For local development, run
  # "npm run dev" instead and start only: docker compose up db keycloak-db keycloak
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-domainapp}:${POSTGRES_PASSWORD:-domainapp}@db:5432/${POSTGRES_DB:-domain_knowledge}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-me-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_ORIGIN: ${APP_URL:-http://localhost:3000}/api/auth
      OIDC_ISSUER: ${OIDC_ISSUER:-http://keycloak:8080/auth/realms/domain-app}
      # Docker-internal Keycloak URL used for server-side OIDC calls (discovery,
      # token exchange, userinfo). Keeps all server→Keycloak traffic on plain HTTP
      # so Node.js never needs to verify the self-signed TLS cert — Node 18+
      # fetch (undici) ignores NODE_EXTRA_CA_CERTS, making that approach useless.
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/auth/realms/domain-app
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-domain-knowledge-app}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-dev-client-secret}
      NODE_ENV: production
    # Port 3000 is not published — Nginx is the only entry point for external traffic.

  # ── Nginx reverse proxy (TLS termination) ─────────────────────────────────────
  # Built from nginx/Dockerfile which bakes in the pre-generated certificate.
  # Run "bash nginx/generate-cert.sh <server-ip>" before building this image.
  # HTTP (port 80) is redirected to HTTPS (port 443).
  # Both the app (/) and Keycloak (/auth/) are served from port 443.
  # All internal traffic stays on plain HTTP — Nginx is the only TLS endpoint.
  nginx:
    build: ./nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      keycloak:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres_data:
  keycloak_data:
