events {
    worker_connections 1024;
}

http {
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Redirect all plain HTTP to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Single HTTPS entry point — Nginx terminates TLS for both the app and Keycloak.
    # /auth/  → Keycloak (plain HTTP internally, --http-relative-path=/auth)
    # /       → Nuxt app (plain HTTP internally)
    server {
        listen 443 ssl;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  https;

        # Keycloak — preserve the /auth/ prefix; Keycloak is configured with
        # --http-relative-path=/auth so it expects requests at /auth/...
        # Do NOT add a trailing slash to proxy_pass — that would strip /auth/.
        # X-Forwarded-Port 443 lets Keycloak build https://host/auth/... URLs
        # (port 443 is the HTTPS default so it is omitted from the URL).
        location /auth/ {
            proxy_set_header X-Forwarded-Host   $host;
            proxy_set_header X-Forwarded-Port   $server_port;
            proxy_pass http://keycloak:8080;
        }

        location / {
            proxy_pass http://app:3000;
        }
    }
}
