events {
    worker_connections 1024;
}

http {
    # Common TLS settings reused by both HTTPS servers
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Redirect all plain HTTP to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS — TLS termination, proxy to the Nuxt app
    server {
        listen 443 ssl;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  https;

        location / {
            proxy_pass http://app:3000;
        }
    }

    # HTTPS — TLS termination, proxy to Keycloak
    # Keycloak itself stays on plain HTTP (port 8080); Nginx provides TLS.
    # NODE_EXTRA_CA_CERTS in the app container trusts this cert for server-side
    # OIDC calls so Node.js can verify the self-signed certificate.
    #
    # $http_host (not $host) is used so Keycloak receives "192.168.x.x:8443"
    # including the port. Without the port Keycloak builds authorization URLs
    # as https://192.168.x.x (port 443) which lands on the wrong Nginx block.
    server {
        listen 8443 ssl;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header Host               $http_host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  https;

        location / {
            proxy_pass http://keycloak:8080;
        }
    }
}
